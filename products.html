<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sản phẩm - PHONE STORE</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <a href="index.html" class="tenShop">PHONE STORE</a>
        <p class="slogan">Công nghệ trong tầm tay</p>
      </div>
      <nav class="menu">
        <a href="index.html" class="menu-link active">Trang chủ</a>
        <a href="products.html" class="menu-link">Sản phẩm</a>
        <a href="dangNhap.html" class="menu-link">Tài khoản</a>
        <a href="cart.html" class="menu-link">Giỏ hàng</a>
      </nav>
      <span id="tenNguoiDung"></span>
      <button id="btnDangXuat" type="button">Đăng xuất</button>
      <div class="thanhTimKiem">
        <input type="text" id="timKiem" placeholder="Tìm kiếm iPhone, điện thoại..." />
        <button type="button" onclick="timKiemSanPham()">Tìm kiếm</button>
      </div>
    </header>
    <main class="trangChu">
      <div class="boLocSanPham">
        <h3>Danh mục sản phẩm</h3>
        <div class="nhomNut">
          <button onclick="locTheoLoai('tatca')">Tất cả</button>
          <button onclick="locTheoLoai('dienthoai')">Điện thoại</button>
          <button onclick="locTheoLoai('laptop')">Laptop</button>
          <button onclick="locTheoLoai('maytinhbang')">Máy tính bảng</button>
          <button onclick="locTheoLoai('dongho')">Đồng hồ</button>
          <button onclick="locTheoLoai('tainghe')">Tai nghe</button>
          <button onclick="locTheoLoai('loa')">Loa</button>
          <button onclick="locTheoLoai('phukien')">Phụ kiện</button>
          <button onclick="locTheoLoai('manhinh')">Màn hình</button>
          <button onclick="locTheoLoai('maychoigame')">Máy chơi game</button>
        </div>
      </div>
      <div id="products-list" class="product-list"></div>
    </main>
    <footer class="footer">
      <div class="footer-content">
        <div class="footer-brand">
          <h2>PHONE STORE</h2>
          <p>Công nghệ trong tầm tay.</p>
        </div>
        <div class="footer-contact">
          <h3>Thông tin liên hệ</h3>
          <p>Điện thoại: 038241855</p>
          <p>Địa chỉ: Quận 12, TP. Hồ Chí Minh</p>
        </div>
      </div>
      <div class="footer-bottom">© 2026 PHONE STORE. All rights reserved.</div>
    </footer>
    <script src="data.js"></script>
    <script src="products.js"></script>
    <script src="header.js"></script>
  </body>
</html>
